version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: meeting_assistant_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: meeting_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Database UI client for visual inspection
  adminer:
    image: adminer:latest
    container_name: meeting_assistant_adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
